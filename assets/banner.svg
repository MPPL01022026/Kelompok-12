<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Banner Digital Twin UMKM Bakso Goreng Kak Linda">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1407"/><stop offset="1" stop-color="#5a2b0e"/></linearGradient>
<linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#e09a1f"/></linearGradient>
<radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f6b94a"/><stop offset=".6" stop-color="#c8741c"/><stop offset="1" stop-color="#7a3d0c"/></radialGradient>
</defs>
<style>
.hop{animation:hop 2.4s ease-in-out infinite}
.bub{animation:rise 3s ease-in infinite}
.stm{animation:stm 3.2s ease-in-out infinite;fill:none;stroke:#fff3d6;stroke-width:4;stroke-linecap:round}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@keyframes stm{0%{opacity:0;transform:translateY(0)}50%{opacity:.55}100%{opacity:0;transform:translateY(-34px)}}
</style>
<rect width="900" height="280" fill="url(#bg)"/>
<rect x="0" y="262" width="900" height="18" fill="#c0392b"/>
<text x="40" y="105" font-family="Verdana,Arial,sans-serif" font-size="40" font-weight="bold" fill="#ffd166">Digital Twin UMKM</text>
<text x="40" y="150" font-family="Verdana,Arial,sans-serif" font-size="24" fill="#fff3d6">Bakso Goreng Kak Linda</text>
<text x="40" y="200" font-family="Verdana,Arial,sans-serif" font-size="15" fill="#f1c27d">Kelompok 12 • Informatika • Universitas Samudra</text>
<text x="40" y="228" font-family="Verdana,Arial,sans-serif" font-size="13" fill="#f1c27d">Manajemen Proyek Perangkat Lunak</text>
<rect x="780" y="196" width="100" height="12" rx="6" fill="#1a0d05"/>
<ellipse cx="640" cy="205" rx="160" ry="40" fill="#1a0d05"/>
<ellipse cx="640" cy="196" rx="145" ry="29" fill="url(#oil)"/>
<circle class="bub" cx="560" cy="200" r="4" fill="#fff3d6" style="animation-delay:0s"/>
<circle class="bub" cx="600" cy="208" r="3" fill="#fff3d6" style="animation-delay:.9s"/>
<circle class="bub" cx="685" cy="206" r="4" fill="#fff3d6" style="animation-delay:1.6s"/>
<circle class="bub" cx="725" cy="198" r="3" fill="#fff3d6" style="animation-delay:2.2s"/>
<circle class="hop" cx="590" cy="184" r="20" fill="url(#ball)" style="animation-delay:0s"/>
<circle class="hop" cx="645" cy="178" r="22" fill="url(#ball)" style="animation-delay:.8s"/>
<circle class="hop" cx="700" cy="186" r="19" fill="url(#ball)" style="animation-delay:1.5s"/>
<path class="stm" d="M590 130 q-8 -12 0 -24 q8 -12 0 -24" style="animation-delay:0s"/>
<path class="stm" d="M645 125 q-8 -12 0 -24 q8 -12 0 -24" style="animation-delay:1s"/>
<path class="stm" d="M700 130 q-8 -12 0 -24 q8 -12 0 -24" style="animation-delay:2s"/>
</svg>
