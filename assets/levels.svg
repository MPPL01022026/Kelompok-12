<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Tusuk progres: tahap 1 selesai sebagai draf, tahap 2 sedang berjalan, lima tahap lain belum dimulai">
<defs>
<radialGradient id="ball" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#d98424"/><stop offset="1" stop-color="#6e3109"/></radialGradient>
<radialGradient id="tahu" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffd98a"/><stop offset=".6" stop-color="#d9892b"/><stop offset="1" stop-color="#8a4510"/></radialGradient>
<linearGradient id="sosis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2683a"/><stop offset=".5" stop-color="#b8381a"/><stop offset="1" stop-color="#6e1d0c"/></linearGradient>
<linearGradient id="tempe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a24a"/><stop offset="1" stop-color="#8a5a1c"/></linearGradient>
<filter id="crisp" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/><feDiffuseLighting in="n" lighting-color="#fff0cf" surfaceScale="2.5" result="l"><feDistantLight azimuth="225" elevation="60"/></feDiffuseLighting><feBlend in="d" in2="l" mode="multiply" result="m"/><feComposite in="m" in2="d" operator="in"/></filter>
<style>.pl{animation:pl 1.6s ease-in-out infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}</style>
</defs>
<rect width="900" height="220" rx="16" fill="#2a1407"/>
<text x="450" y="34" text-anchor="middle" font-family="Verdana,Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffd166">Tusuk Progres: 1 dari 7 tahap selesai (draf)</text>
<line x1="30" y1="100" x2="858" y2="100" stroke="#c9a36a" stroke-width="6" stroke-linecap="round"/><polygon points="858,92 884,100 858,108" fill="#c9a36a"/>
<circle cx="90" cy="100" r="30" fill="url(#ball)" filter="url(#crisp)"/><path d="M78 100 l8 9 16-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffd166">Inisiasi</text><text x="90" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="1">selesai (draf)</text>
<circle cx="210" cy="100" r="30" fill="#6b3a14" stroke="#ffb938" stroke-width="4"/><circle class="pl" cx="210" cy="100" r="30" fill="none" stroke="#ff7a1a" stroke-width="3"><animate attributeName="r" values="30;40;30" dur="1.6s" repeatCount="indefinite"/></circle><text x="210" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="24" font-weight="bold" fill="#ffe29a">2</text>
<text x="210" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffd166">Perencanaan</text><text x="210" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="1">sedang berjalan</text>
<circle cx="330" cy="100" r="30" fill="#4a3a2c" opacity=".7" stroke="#8a7762" stroke-width="3" stroke-dasharray="5 4"/><text x="330" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9b79c">3</text>
<text x="330" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9b79c">Analisis</text><text x="330" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="0.6">belum dimulai</text>
<circle cx="450" cy="100" r="30" fill="#4a3a2c" opacity=".7" stroke="#8a7762" stroke-width="3" stroke-dasharray="5 4"/><text x="450" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9b79c">4</text>
<text x="450" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9b79c">Perancangan</text><text x="450" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="0.6">belum dimulai</text>
<circle cx="570" cy="100" r="30" fill="#4a3a2c" opacity=".7" stroke="#8a7762" stroke-width="3" stroke-dasharray="5 4"/><text x="570" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9b79c">5</text>
<text x="570" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9b79c">Pengembangan</text><text x="570" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="0.6">belum dimulai</text>
<circle cx="690" cy="100" r="30" fill="#4a3a2c" opacity=".7" stroke="#8a7762" stroke-width="3" stroke-dasharray="5 4"/><text x="690" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9b79c">6</text>
<text x="690" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9b79c">Pengujian</text><text x="690" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="0.6">belum dimulai</text>
<circle cx="810" cy="100" r="30" fill="#4a3a2c" opacity=".7" stroke="#8a7762" stroke-width="3" stroke-dasharray="5 4"/><text x="810" y="108" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold" fill="#c9b79c">7</text>
<text x="810" y="152" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="13" font-weight="bold" fill="#c9b79c">Dokumentasi</text><text x="810" y="171" font-family="Verdana,Arial,sans-serif" text-anchor="middle" font-size="11" fill="#e0b97a" opacity="0.6">belum dimulai</text>
</svg>