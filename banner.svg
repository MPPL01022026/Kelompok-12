<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Banner Digital Twin UMKM Bakso Goreng Kak Linda" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150a03"/><stop offset="1" stop-color="#4a210b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></radialGradient>
<linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset=".5" stop-color="#ffb938"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient>
<linearGradient id="oil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b73a"/><stop offset="1" stop-color="#a85a0c"/></linearGradient>
<linearGradient id="wok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
<linearGradient id="fire" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d62d1a"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ffe066"/></linearGradient>
<radialGradient id="ball" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#ffd27a"/><stop offset=".45" stop-color="#d98424"/><stop offset="1" stop-color="#6e3109"/></radialGradient>
<radialGradient id="tahu" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ffd98a"/><stop offset=".6" stop-color="#d9892b"/><stop offset="1" stop-color="#8a4510"/></radialGradient>
<linearGradient id="sosis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2683a"/><stop offset=".5" stop-color="#b8381a"/><stop offset="1" stop-color="#6e1d0c"/></linearGradient>
<linearGradient id="tempe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a24a"/><stop offset="1" stop-color="#8a5a1c"/></linearGradient>
<filter id="crisp" x="-20%" y="-20%" width="140%" height="140%">
<feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
<feDiffuseLighting in="n" lighting-color="#fff0cf" surfaceScale="2.5" result="l"><feDistantLight azimuth="225" elevation="60"/></feDiffuseLighting>
<feBlend in="d" in2="l" mode="multiply" result="m"/>
<feComposite in="m" in2="d" operator="in"/>
</filter>
<style>
.hop{animation:hop 2.4s ease-in-out infinite}
.bob{animation:bob 3s ease-in-out infinite}
.bub{animation:rise 2.8s ease-in infinite}
.stm{animation:stm 3.2s ease-in-out infinite;fill:none;stroke:#fff3d6;stroke-width:4;stroke-linecap:round}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .9s ease-in-out infinite alternate}
.em{animation:em 4s ease-out infinite}
.sh{animation:sh 3s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-26px);opacity:0}}
@keyframes stm{0%{opacity:0;transform:translateY(0)}50%{opacity:.5}100%{opacity:0;transform:translateY(-34px)}}
@keyframes fl{0%{transform:scaleY(.8) scaleX(1)}100%{transform:scaleY(1.15) scaleX(.92)}}
@keyframes em{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-150px);opacity:0}}
@keyframes sh{0%,100%{opacity:.12}50%{opacity:.32}}
</style>
